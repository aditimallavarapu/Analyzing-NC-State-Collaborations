<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NC State Research Networks · Year by Year</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
/* Same tokens, network and tooltip styles as ui_template.html; the controls live in one column on the left. */
:root {
  color-scheme: dark;
  --bg: #121211; --bg-rgb: 18,18,17; --ink: 255,255,255;
  --tip: rgba(34,34,32,.96); --surface: #1e1e1c;
  --line: rgba(var(--ink),.09);
  --text: #f0efec; --muted: #a3a29a; --faint: #6f6e68;
  --gold: #e8d9a8; --ring: #ffffff; --shadow: rgba(0,0,0,.45);
  --e-now: .34;   /* strength of a collaboration line */
  --side: 440px;  /* width of the left column */
  --font: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f5f1; --bg-rgb: 246,245,241; --ink: 20,20,18;
  --tip: rgba(255,255,255,.98); --surface: #ffffff;
  --text: #1b1b19; --muted: #5d5c56; --faint: #8a8981;
  --gold: #8a6d1b; --ring: #121211; --shadow: rgba(30,30,25,.16);
  --e-now: .45;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage svg { width: 100%; height: 100%; display: block; cursor: grab; }
#stage svg:active { cursor: grabbing; }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }

/* left column */
#side { position: fixed; left: 0; top: 0; bottom: 0; width: var(--side); z-index: 10; padding: 36px 44px 36px 56px; display: flex; flex-direction: column;
  background: linear-gradient(to right, rgba(var(--bg-rgb),.97) 80%, rgba(var(--bg-rgb),0)); }
.brand { display: flex; align-items: center; gap: 12px; }
.brand img { height: 26px; width: auto; display: block; border-radius: 2px; }
.brand span { font-size: 15.5px; font-weight: 600; letter-spacing: -.01em; }
#yr { font-size: 84px; font-weight: 750; letter-spacing: -.05em; line-height: .9; margin-top: 46px; }
.grp { margin-top: 30px; }
.grp h4 { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 500; color: var(--muted); }
.grp h4 em { font-style: normal; font-size: 12px; color: var(--faint); margin-left: 8px; }
.grp h4 b { font-size: 22px; color: var(--text); font-weight: 700; letter-spacing: -.02em; }
.stack { display: flex; height: 10px; gap: 3px; margin-top: 10px; }
.stack i { border-radius: 3px; background: var(--k); transition: flex-grow .5s ease; min-width: 0; }
.lg { display: flex; gap: 14px; margin-top: 9px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.lg span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; background: var(--k); }
.lg em { font-style: normal; color: var(--faint); margin-left: 4px; }
.k1 { --k: var(--text); } .k2 { --k: rgba(var(--ink),.5); } .k3 { --k: rgba(var(--ink),.22); }
.grow { flex: 1; min-height: 16px; }
.cap { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.cap b { color: var(--text); font-weight: 600; }
#tl { cursor: pointer; touch-action: none; user-select: none; border-radius: 4px; }
#tl:focus-visible { outline: 2px solid rgba(var(--ink),.4); outline-offset: 4px; }
#bars { display: flex; align-items: flex-end; gap: 4px; height: 48px; }
#bars div { flex: 1; display: flex; flex-direction: column-reverse; gap: 1px; min-height: 2px; transition: height .3s ease; }
#bars i { display: block; border-radius: 1px; background: rgba(var(--ink),.16); }
#bars i.x { background: rgba(var(--ink),.5); }
#bars div.on i { background: rgba(var(--ink),.4); } #bars div.on i.x { background: var(--text); }
#ticks { display: flex; justify-content: space-between; margin-top: 6px; font-size: 10.5px; color: var(--faint); }
.ctrl { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
#play { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--text); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
#play:hover { opacity: .88; }
#play:focus-visible { outline: 2px solid rgba(var(--ink),.4); outline-offset: 2px; }
#play svg { width: 15px; height: 15px; fill: var(--bg); }
#play .i-pause, #play.on .i-play { display: none; }
#play.on .i-pause { display: block; }
.seg { display: inline-flex; padding: 3px; border-radius: 9px; background: rgba(var(--ink),.06); }
.seg button { font-size: 12px; font-weight: 600; color: var(--muted); padding: 5px 9px; border-radius: 7px; border: 0; background: none; cursor: pointer; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.25); }

/* top-right corner */
#tr { position: fixed; top: 24px; right: 26px; z-index: 11; display: flex; gap: 18px; align-items: center; }
#tr a { font-size: 13px; color: var(--muted); text-decoration: none; }
#tr a:hover { color: var(--text); }
.tbtn { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: none; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.tbtn:hover { border-color: rgba(var(--ink),.3); }
.tbtn svg { width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tbtn:hover svg { stroke: var(--text); }
:root:not([data-theme="light"]) .i-moon, :root[data-theme="light"] .i-sun { display: none; }

#empty { position: fixed; left: var(--side); right: 0; top: 0; bottom: 0; display: none; align-items: center; justify-content: center; z-index: 4; pointer-events: none; text-align: center;
  color: var(--muted); font-size: 14px; line-height: 1.6; }
#empty.show { display: flex; }
#empty b { display: block; color: var(--text); font-size: 16px; margin-bottom: 4px; }

/* svg bits */
.edge { stroke: rgb(var(--ink)); stroke-opacity: var(--e-now); fill: none; vector-effect: non-scaling-stroke; transition: stroke-opacity .4s; }
.edge.hi { stroke-opacity: .9; }
.edge.dim { stroke-opacity: .015; }
.hit { stroke: transparent; stroke-width: 9px; fill: none; vector-effect: non-scaling-stroke; cursor: pointer; }
.node { stroke: var(--bg); stroke-width: 1.2; vector-effect: non-scaling-stroke; transition: opacity .15s; cursor: pointer; }
.node.gone, .hit.gone { pointer-events: none; }
.no-anim, .no-anim * { transition: none !important; }
.node.dim { opacity: .1; }
.node.pin { stroke: var(--ring); stroke-width: 2.5; }
.glabel { font: 600 calc(13px / var(--k, 1)) var(--font); fill: var(--muted); text-anchor: middle; pointer-events: none;
  paint-order: stroke; stroke: var(--bg); stroke-width: calc(4px / var(--k, 1)); stroke-linejoin: round; }

/* tooltip */
#tip { position: fixed; z-index: 20; pointer-events: none; display: none; min-width: 190px; max-width: 320px; padding: 12px 14px;
  background: var(--tip); border: 1px solid rgba(var(--ink),.12); border-radius: 12px;
  box-shadow: 0 12px 32px var(--shadow); }
#tip .n { font-size: 14px; font-weight: 650; letter-spacing: -.01em; }
#tip .c { display: flex; align-items: center; gap: 7px; margin-top: 4px; font-size: 12px; color: var(--muted); }
#tip .c i { width: 8px; height: 8px; border-radius: 50%; }
#tip .d { font-size: 12px; color: var(--faint); margin-top: 2px; }
#tip .cf { font-size: 12px; color: var(--gold); margin-top: 6px; }
#tip .r { display: flex; justify-content: space-between; gap: 18px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line);
  font-size: 12px; color: var(--muted); }
#tip .r + .r { margin-top: 6px; padding-top: 6px; }
#tip .r b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
#tip .pair { display: flex; flex-direction: column; gap: 5px; }
#tip .pair div { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 650; letter-spacing: -.01em; }
#tip .pair i { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
#tip .papers { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
#tip .papers h4 { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-bottom: 5px; }
#tip .papers p { font-size: 12px; line-height: 1.4; color: var(--muted); padding: 3px 0; }

/* narrow screens: the column becomes a short panel along the bottom (year, timeline, controls) */
@media (max-width: 900px) {
  #side { top: auto; width: auto; right: 0; padding: 18px 16px 16px; background: linear-gradient(to top, rgba(var(--bg-rgb),.97) 80%, rgba(var(--bg-rgb),0)); }
  .brand, .grp, .grow, .cap { display: none; }
  #yr { font-size: 40px; margin: 0 0 12px; }
  #empty { left: 0; bottom: 220px; }
}
</style>

<script>
const D = __DATA__;
// Same college colours as ui_template.html (one per college, a set tuned for each background).
const DARK_COL  = ["#3987e5","#d95926","#199e70","#c98500","#d55181","#9085e9","#008300","#e66767","#1b98b0","#8f9a1c"];
const LIGHT_COL = ["#3987e5","#d95926","#18956a","#c28000","#d55181","#8478e7","#359f3e","#e35555","#1a90a7","#b66ecf"];
const isLight = () => document.documentElement.dataset.theme === "light";
const COL = (isLight() ? LIGHT_COL : DARK_COL).slice();
const paintVars = () => COL.forEach((c, i) => document.documentElement.style.setProperty("--col" + i, c));   // nodes read these, so a theme switch needs no per-node work
paintVars();

const YEARS = Object.keys(D.years).map(Number).sort((a, b) => a - b), FIRST = YEARS[0], LAST = YEARS[YEARS.length - 1];
const state = { year: FIRST, playing: false, speed: 1 };
{ const q = new URLSearchParams(location.search);   // optional deep-link: ?year=2015&speed=2&play
  if (q.has("year") && D.years[q.get("year")]) state.year = +q.get("year");
  if (q.has("speed")) state.speed = +q.get("speed") || 1; }

// people: [id, name, college, dept, is_cfep, cfep cluster]; their positions are in POS
const P = D.people.map((r, i) => ({ i, id: r[0], nm: r[1], c: r[2], d: r[3] || "Other", f: r[4] === 1, k: r[5] }));

const svg = d3.select("#svg"), root = svg.append("g");
// layers, bottom to top: ties, hover targets, this year's people, labels
const gE = root.append("g"), gH = root.append("g"), gN = root.append("g"), gL = root.append("g");
let userZoomed = false;
const zoom = d3.zoom().scaleExtent([0.1, 12]).on("zoom", e => { root.attr("transform", e.transform); gL.style("--k", e.transform.k); if (e.sourceEvent) userZoomed = true; });
svg.call(zoom).on("dblclick.zoom", null);

const SVGNS = "http://www.w3.org/2000/svg", diamondPath = "M0,-1.3L1.05,0L0,1.3L-1.05,0Z";
const VW = 900, VH = 900;      // the space the layout is worked out in; the camera fits it to the window
const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const jit = (id, salt) => (hash(id + salt) % 10000) / 10000 - .5;   // deterministic "random": the same layout every time
const pEsc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = n => n.toLocaleString();
const pairKey = (a, b) => a < b ? a + "|" + b : b + "|" + a;
const yearEdges = y => D.years[y].e;

// ---------- positions ----------
// Only faculty with a co-author that year are drawn, so only they need a place. Each college is a round cluster.
// Someone who keeps collaborating keeps their spot from one year to the next; a year without co-authors frees it,
// and that year's newcomers take the nearest free spot to their same-college co-authors (or, failing that, their
// department colleagues, or the middle), so gaps fill up instead of staying empty. The clusters sit on a ring that
// each year is just wide enough for them to clear each other, and the camera frames that year's people. Worked out
// once for everyone; the filters reuse the same positions.
const pubsOf = y => new Map(D.years[y].n);
const rS = d3.scaleSqrt().domain([1, Math.max(2, d3.max(YEARS, y => { const p = pubsOf(y); return d3.max(D.years[y].e, e => Math.max(p.get(e[0]), p.get(e[1]))); }) || 2)]).range([5, 24]);
const POS = new Map();          // person index -> {r, last}: largest size in any year, and the last spot they had
const OFF = {};                 // year -> Map(person -> [x, y]): spots relative to their college's centre that year
const CENTER = {};              // year -> Map(college -> [x, y]): where each college's cluster sits that year
const posAt = (i, y) => { const o = OFF[y].get(i) || POS.get(i).last, c = CENTER[y].get(P[i].c); return [c[0] + o[0], c[1] + o[1]]; };
function layoutAll() {

}

// ---------- the scene: every year's frame ----------
let sc = null, cur = null;    // the scene and the current year's frame
function frameFor(y) {
  const src = D.years[y], pubs = new Map(src.n), adj = new Map();
  const edges = src.e.map(e => {
    [[e[0], e[1]], [e[1], e[0]]].forEach(([a, b]) => { if (!adj.has(a)) adj.set(a, new Set()); adj.get(a).add(b); });
    return { k: pairKey(e[0], e[1]), a: e[0], b: e[1], w: e[2], t: e[3].map(t => D.titles[t]), xc: P[e[0]].c !== P[e[1]].c };
  });
  const nodes = [...adj.keys()].map(i => ({ i, p: pubs.get(i) || 1 }));   // only people with a co-author this year
  return { y, nodes, edges, adj };
}
function makeScene() {
  const frames = {}, since = new Map();
  let last = new Set();
  for (const y of YEARS) {
    const F = frames[y] = frameFor(y);
    F.edges.forEach(e => { if (!since.has(e.k)) since.set(e.k, y); });
    // the year's breakdown for the left column: new / continued from last year / returning after a gap,
    // cross-college ties, and faculty with at least one co-author in another college
    F.fresh = F.edges.filter(e => since.get(e.k) === y).length;
    F.cont = F.edges.filter(e => last.has(e.k)).length;
    F.ret = F.edges.length - F.fresh - F.cont;
    F.cross = F.edges.filter(e => e.xc).length;
    F.reached = F.nodes.filter(n => [...F.adj.get(n.i)].some(j => P[j].c !== P[n.i].c)).length;
    last = new Set(F.edges.map(e => e.k));
  }
  const wMax = d3.max(YEARS, y => d3.max(frames[y].edges, e => e.w)) || 1;
  return { frames, since, groups: {}, wS: d3.scaleLinear().domain([1, Math.max(2, wMax)]).range([.8, 4]) };
}
function groupsFor(y) {           // colleges with anyone that year, and the people in each (for labels and the camera)
  if (sc.groups[y]) return sc.groups[y];
  const m = new Map(); sc.frames[y].nodes.forEach(({ i }) => { const c = P[i].c, [x, yy] = posAt(i, y); if (!m.has(c)) m.set(c, []); m.get(c).push({ x, y: yy, r: POS.get(i).r }); });
  return sc.groups[y] = [...m].map(([k, members]) => ({ k, members }));
}

function labelXY(members) {      // labels sit just outside each cluster, away from the centre (same rule as the main page)
  let sx = 0, sy = 0; for (const n of members) { sx += n.x; sy += n.y; }
  const cx = sx / members.length, cy = sy / members.length; let ext = 0;
  for (const n of members) ext = Math.max(ext, Math.hypot(n.x - cx, n.y - cy) + n.r);
  let dx = cx - VW / 2, dy = cy - VH / 2; const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
  return [cx + dx * (ext + 16), cy + dy * (ext + 16) + 4];
}
function camera(W, H, y) {        // frames that year's people, so the view widens as the network grows
  const groups = groupsFor(y); if (!groups.length) return null;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  groups.forEach(g => g.members.forEach(m => { x0 = Math.min(x0, m.x - m.r); x1 = Math.max(x1, m.x + m.r); y0 = Math.min(y0, m.y - m.r); y1 = Math.max(y1, m.y + m.r); }));

function labels(dur) {            // one label per college with anyone so far; they move outward with their cluster
  gL.selectAll("text.glabel").data(groupsFor(state.year), g => g.k).join(
    enter => enter.append("text").attr("class", "glabel")
      .text(g => D.colleges[g.k].length > 28 ? D.colleges[g.k].slice(0, 27) + "…" : D.colleges[g.k])
      .each(function (g) { const [x, y] = labelXY(g.members); this.setAttribute("x", x); this.setAttribute("y", y); })
      .call(s => { s.append("title").text(g => D.colleges[g.k]); if (dur) s.style("opacity", 0).transition().duration(dur).style("opacity", 1); }),
    update => update.call(s => (dur ? s.transition().duration(dur).ease(d3.easeCubicInOut) : s)
      .attr("x", g => labelXY(g.members)[0]).attr("y", g => labelXY(g.members)[1]).style("opacity", 1)),
    exit => exit.remove()

}

// ---------- drawing a year ----------
// One animation loop moves everything at once: each person glides from where they are now to where their college sits
// this year (CUR holds the in-between positions), nodes grow or shrink to this year's size, and lines follow their ends.
const CUR = new Map();          // person index -> [x, y] right now
const interval = () => 1400 / state.speed;
// ties inside a college are straight; ties between colleges bend towards the middle, so they bundle into flows instead of a tangle
const edgePath = (a, b, xc) => { if (!xc) return "M" + a[0] + "," + a[1] + "L" + b[0] + "," + b[1];
  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
  return "M" + a[0] + "," + a[1] + "Q" + (mx + (VW / 2 - mx) * .6) + "," + (my + (VH / 2 - my) * .6) + " " + b[0] + "," + b[1]; };

let hover = null, lastEv = null, anim = null;   // hovered node / edge, last mouse event, running loop

function draw(animate) {
  const F = cur = sc.frames[state.year], dur = animate ? Math.min(900, interval() * .6) : 0;
  if (anim) { anim.stop(); anim = null; } gN.selectAll(".node.gone").remove();   // a newer year took over mid-move
  const moving = [...new Set([...CUR.keys(), ...F.nodes.map(n => n.i)])], from = new Map(), to = new Map();
  for (const i of moving) { const t = posAt(i, F.y); to.set(i, t); if (!CUR.has(i)) CUR.set(i, t); from.set(i, CUR.get(i)); }
  const wNow = new Map(F.edges.map(e => [e.k, e.w])), width = d => sc.wS(d.w);
  // only this year's collaborations: new ones fade in, ones that didn't continue fade out
  const es = gE.selectAll(".edge:not(.gone)").data(F.edges, d => d.k).join(
    enter => enter.append("path").attr("class", "edge").each(function (d) { setLine(this, d); }).attr("stroke-width", width)
      .call(s => { if (dur) s.style("opacity", 0).transition().delay(dur * .25).duration(dur * .75).style("opacity", 1); }),
    update => update.attr("stroke-width", width).style("opacity", 1),
    exit => exit.classed("gone", true).call(s => dur ? s.transition().duration(dur * .5).style("opacity", 0).remove() : s.remove())
  );
  const ns = gN.selectAll(".node:not(.gone)").data(F.nodes, d => d.i).join(
    enter => enter.append(d => document.createElementNS(SVGNS, P[d.i].f ? "path" : "circle"))   // CFEP members are diamonds
      .attr("class", "node")
      .each(function (d) { if (P[d.i].f) this.setAttribute("d", diamondPath); else this.setAttribute("r", 1); this.style.fill = "var(--col" + P[d.i].c + ")"; this._r = 0; })
      .on("mouseover", (ev, d) => { hover = { t: "n", k: d.i }; lastEv = ev; showTip(); highlight(); })
      .on("mousemove", ev => { lastEv = ev; moveTip(ev); })
      .on("mouseout", () => { hover = null; hideTip(); highlight(); }),
    update => update,
    exit => exit.classed("gone", true)                 // shrinks away in the loop below, then is removed
  );
  const nodeEls = [], all = gN.selectAll(".node");
  all.each(function (d) { this._r0 = this._r || 0; this._r1 = this.classList.contains("gone") ? 0 : rS(d.p); nodeEls.push(this); });   // people who stay resize to this year's publications
  const edgeEls = [];
  gE.selectAll(".edge").each(function (d) { edgeEls.push([this, d]); });
  const apply = e => {
    for (const i of moving) { const f = from.get(i), t = to.get(i); CUR.set(i, [f[0] + (t[0] - f[0]) * e, f[1] + (t[1] - f[1]) * e]); }

      el.setAttribute("transform", "translate(" + p[0] + "," + p[1] + ") scale(" + Math.max(r, 1e-6) + ")"); }

    enter => enter.append("path").attr("class", "hit")
      .on("mouseover", (ev, d) => { hover = { t: "e", k: d.k }; lastEv = ev; showTip(); highlight(); })

  else if (hover) showTip();

}

function highlight() {
  const F = cur; if (!F) return;
  const ns = gN.selectAll(".node:not(.gone)"), es = gE.selectAll(".edge:not(.gone)");

      `<div class="r"><span>${metric} in ${F.y}</span><b>${fn ? fn.p : 0}</b></div><div class="r"><span>Collaborators in ${F.y}</span><b>${F.adj.get(hover.k)?.size || 0}</b></div>`;
  } else {

// ---------- left column: the year's breakdown, timeline and controls ----------

const $ = id => document.getElementById(id);

// ---------- playback ----------

function setPlaying(on) {
  state.playing = on; clearTimeout(timer);
  playBtn.classList.toggle("on", on); playBtn.setAttribute("aria-label", on ? "Pause" : "Play"); playBtn.title = (on ? "Pause" : "Play") + " (Space)";
  if (!on) return;
  if (userZoomed) { userZoomed = false; fit(400); }              // playing hands the camera back to the animation
  if (state.year >= LAST) { state.year = FIRST; draw(true); }   // play from the end starts over
  const step = () => {
    timer = setTimeout(() => {
      state.year++; draw(true);
      if (state.year >= LAST) setPlaying(false); else step();
    }, interval());
  };
  step();
}
function goYear(y, animate = true) {
  y = Math.max(FIRST, Math.min(LAST, y)); if (y === state.year) return;
  setPlaying(false); state.year = y; draw(animate);
}
playBtn.onclick = () => setPlaying(!state.playing);
if (![.5, 1, 2].includes(state.speed)) state.speed = 1;
document.querySelectorAll("#speed button").forEach(b => b.onclick = () => { state.speed = +b.dataset.v; controlsUI(); if (state.playing) setPlaying(true); });
// click or drag along the bars to scrub
const yearAt = ev => { const r = bars.getBoundingClientRect(); return YEARS[Math.max(0, Math.min(YEARS.length - 1, Math.floor((ev.clientX - r.left) / r.width * YEARS.length)))]; };
tl.addEventListener("pointerdown", ev => { tl.setPointerCapture(ev.pointerId); goYear(yearAt(ev)); });
tl.addEventListener("pointermove", ev => { if (tl.hasPointerCapture(ev.pointerId)) goYear(yearAt(ev)); });
addEventListener("keydown", ev => {
  if (ev.key === " " && !ev.target.closest("button")) { ev.preventDefault(); setPlaying(!state.playing); }
  else if (ev.key === "ArrowRight") { ev.preventDefault(); goYear(state.year + 1); }
  else if (ev.key === "ArrowLeft") { ev.preventDefault(); goYear(state.year - 1); }
  else if (ev.key === "Home") goYear(FIRST);
  else if (ev.key === "End") goYear(LAST);
});

// ---------- light / dark ----------
const tbtn = document.getElementById("tbtn");
function setTheme(t) {
  const html = document.documentElement;
  html.classList.add("no-anim"); html.dataset.theme = t;
  try { localStorage.setItem("theme", t); } catch (e) {}
  const next = t === "light" ? "Switch to dark mode" : "Switch to light mode";
  tbtn.setAttribute("aria-label", next); tbtn.title = next;
  COL.splice(0, COL.length, ...(t === "light" ? LIGHT_COL : DARK_COL));
  paintVars();
  requestAnimationFrame(() => requestAnimationFrame(() => html.classList.remove("no-anim")));
}
tbtn.onclick = () => setTheme(isLight() ? "dark" : "light");
tbtn.setAttribute("aria-label", isLight() ? "Switch to dark mode" : "Switch to light mode"); tbtn.title = tbtn.getAttribute("aria-label");

// ---------- entry points ----------
addEventListener("resize", () => fit(0));
requestAnimationFrame(() => setTimeout(() => {   // let the column paint before the layout is worked out
  layoutAll(); sc = makeScene(); draw(false);
  if (new URLSearchParams(location.search).has("play")) setTimeout(() => setPlaying(true), 400);
}, 0));
</script>
</body>
