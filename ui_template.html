<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NC State Research Networks</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root {
  --bg: #121211;
  --panel: rgba(30,30,28,.82);
  --line: rgba(255,255,255,.09);
  --text: #f0efec;
  --muted: #a3a29a;
  --faint: #6f6e68;
  --accent: #f0efec;
  --font: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage svg { width: 100%; height: 100%; display: block; cursor: grab; }
#stage svg:active { cursor: grabbing; }

/* top bar */
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: 18px 24px 4px; pointer-events: none; }
header::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 90px; z-index: -1; pointer-events: none;
  background: linear-gradient(to bottom, rgba(18,18,17,.96) 55%, rgba(18,18,17,0)); }
header > * { pointer-events: auto; }
.hl { display: inline-flex; flex-direction: column; gap: 14px; pointer-events: none; }
.hl > * { pointer-events: auto; }
.toprow { display: flex; align-items: center; gap: 24px; white-space: nowrap; width: 0; min-width: 100%; }   /* long breadcrumbs overflow to the right instead of widening the block */
.toprow > * { flex-shrink: 0; }
.toprow nav .here { overflow: visible; text-overflow: clip; }
.filters { display: flex; align-items: center; gap: 10px; }
.filters label { font-size: 13px; font-weight: 500; color: var(--muted); }
.brand { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
.brand img { height: 28px; width: auto; display: block; border-radius: 2px; }
.brand span { font-size: 16.5px; font-weight: 600; letter-spacing: -.01em; color: #fff; line-height: 28px; }
nav { display: flex; align-items: center; gap: 6px; font-size: 13px; min-width: 0; }
nav .sep { color: var(--faint); }
nav button { background: none; border: 0; color: var(--muted); font: inherit; cursor: pointer; padding: 4px 8px;
  border-radius: 6px; white-space: nowrap; }
nav button:hover { color: var(--text); background: rgba(255,255,255,.06); }
nav .here { color: var(--text); font-weight: 600; padding: 4px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
.select { position: relative; }
.select select { appearance: none; -webkit-appearance: none; background: var(--panel); color: var(--text);
  border: 1px solid var(--line); border-radius: 10px; padding: 6px 32px 6px 12px; font: 600 13px var(--font);
  cursor: pointer; backdrop-filter: blur(10px); }
.select select:hover { border-color: rgba(255,255,255,.22); }
.select select:focus-visible { outline: 2px solid rgba(255,255,255,.4); outline-offset: 2px; }
.select::after { content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; margin-top: -5px;
  border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg); pointer-events: none; }
.select option { background: #1e1e1c; }

/* search */
.filters { flex-wrap: wrap; }
.search { position: relative; }
.search input { width: 230px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
  padding: 6px 12px 6px 34px; font: 500 13px var(--font); backdrop-filter: blur(10px); outline: none; }
.search input::placeholder { color: var(--faint); }
.search input:hover { border-color: rgba(255,255,255,.22); }
.search input:focus { border-color: rgba(255,255,255,.4); }
.search svg { position: absolute; left: 11px; top: 50%; margin-top: -7px; width: 14px; height: 14px; stroke: var(--faint); fill: none;
  stroke-width: 2; stroke-linecap: round; pointer-events: none; z-index: 1; }
#results { position: absolute; top: calc(100% + 6px); left: 0; width: 340px; max-height: 340px; overflow-y: auto; display: none;
  background: rgba(30,30,28,.97); border: 1px solid var(--line); border-radius: 12px; padding: 6px;
  box-shadow: 0 12px 32px rgba(0,0,0,.45); backdrop-filter: blur(14px); }
#results.show { display: block; }
.res { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.res.on, .res:hover { background: rgba(255,255,255,.08); }
.res i { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.res div { min-width: 0; flex: 1; }
.res b { display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res small { display: block; font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.res em { font-style: normal; font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.res mark { background: none; color: #fff; text-decoration: underline; text-underline-offset: 2px; text-decoration-color: rgba(255,255,255,.35); }
/* insights panel */
.ibtn { position: fixed; top: 18px; right: 24px; z-index: 11; }
.ibtn.open { border-color: rgba(255,255,255,.3); background: rgba(255,255,255,.1); }
#panel { position: fixed; right: 24px; top: 70px; bottom: 24px; width: 330px; z-index: 9; display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(14px); overflow: hidden;
  transform: translateX(calc(100% + 40px)); visibility: hidden; transition: transform .22s ease, visibility 0s linear .22s; }
#panel.open { transform: none; visibility: visible; transition: transform .22s ease; }
#ph { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
#ph h2 { font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
#ph p { font-size: 12.5px; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 7px; }
#ph p i { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
#pb { overflow-y: auto; padding: 6px 10px 14px; flex: 1; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent; }
#pb::-webkit-scrollbar { width: 8px; }
#pb::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 4px; }
#pb::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.28); }
#pb::-webkit-scrollbar-track { background: transparent; }
#pb h3 { font-size: 13px; font-weight: 600; color: var(--text); padding: 14px 8px 6px; display: flex; justify-content: space-between; align-items: baseline; }
#pb h3 small { font-size: 11px; font-weight: 500; color: var(--faint); }
.li { position: relative; display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 8px; cursor: default; overflow: hidden; }
.li[data-go] { cursor: pointer; }
.li::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--w, 0); background: var(--c, #fff); opacity: .13; border-radius: 8px; }
.li:hover { background: rgba(255,255,255,.06); }
.li.p { margin-bottom: 3px; padding: 8px 10px; }
.li.p::before { width: 100%; opacity: .22; transition: opacity .12s; }
.li.p:hover { background: none; }
.li.p:hover::before { opacity: .36; }
.li > * { position: relative; }
.li .rk { width: 16px; font-size: 11.5px; color: var(--faint); text-align: right; font-variant-numeric: tabular-nums; flex-shrink: 0; }
.li i.d { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.li .pair { display: flex; align-items: center; gap: 4px; width: 24px; flex-shrink: 0; margin-top: 3.5px; }
.li .pair i { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.li .tx { flex: 1; min-width: 0; }
.li.pr::before { display: none; }
.li.pr { align-items: flex-start; }
.li.pr .v { line-height: 17px; }
.li.pr .tx b { white-space: normal; line-height: 1.3; }
.li .tx b { display: block; font-size: 13px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .tx small { display: block; font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.li .v { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); }
.dept { padding: 8px 8px 9px; border-radius: 8px; }
.dept:hover { background: rgba(255,255,255,.06); }
.dept .top { display: flex; align-items: center; gap: 9px; }
.dept .top i { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.dept .top b { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dept .top span { font-size: 11.5px; color: var(--faint); }
.stk { display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: rgba(255,255,255,.06); margin: 7px 0 4px 18px; gap: 2px; }
.stk i { display: block; height: 100%; }
.dept small { display: block; margin-left: 18px; font-size: 11px; color: var(--faint); }
.key { display: flex; gap: 14px; padding: 0 8px 4px; font-size: 11px; color: var(--faint); }
.key span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; background: var(--k); vertical-align: -1px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 8px 4px; }
.grid3 div { background: rgba(255,255,255,.05); border-radius: 10px; padding: 10px 10px 9px; }
.grid3 b { display: block; font-size: 19px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.grid3 small { font-size: 11px; color: var(--muted); }
.pnote { padding: 8px 8px 2px; font-size: 12px; color: var(--muted); line-height: 1.45; }
/* filters */
.fwrap { position: relative; }
.fbtn { display: flex; align-items: center; gap: 8px; background: var(--panel); color: var(--text); border: 1px solid var(--line);
  border-radius: 10px; padding: 6px 12px; font: 600 13px var(--font); cursor: pointer; backdrop-filter: blur(10px); }
.fbtn:hover, .fbtn.open { border-color: rgba(255,255,255,.3); }
.fbtn svg { width: 14px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; }
.badge { display: none; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #fff; color: #121211;
  font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
.badge.show { display: inline-block; }
#fpop { position: absolute; top: calc(100% + 6px); left: 0; width: 330px; display: none; padding: 8px;
  background: rgba(30,30,28,.97); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 32px rgba(0,0,0,.45); backdrop-filter: blur(14px); }
#fpop.show { display: block; }
#fpop h3 { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 6px 8px 8px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 8px; background: none; border: 0; border-radius: 10px;
  color: var(--text); font: inherit; text-align: left; cursor: pointer; }
.opt:hover { background: rgba(255,255,255,.06); }
.opt div { flex: 1; min-width: 0; }
.opt b { display: block; font-size: 13px; font-weight: 600; }
.opt small { display: block; font-size: 11.5px; color: var(--faint); margin-top: 2px; line-height: 1.35; }
.opt[disabled] { opacity: .45; cursor: not-allowed; background: none; }
.sw { width: 34px; height: 20px; border-radius: 10px; background: rgba(255,255,255,.14); position: relative; flex-shrink: 0; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.opt.on .sw { background: #3987e5; }
.opt.on .sw::after { transform: translateX(14px); }
#chips { display: flex; gap: 6px; }
.chip { display: flex; align-items: center; gap: 7px; background: rgba(255,255,255,.1); color: var(--text); border: 0; border-radius: 100px;
  padding: 5px 10px 5px 12px; font: 600 12.5px var(--font); cursor: pointer; }
.chip:hover { background: rgba(255,255,255,.17); }
.chip span { color: var(--muted); font-size: 11px; }
#empty { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 4; pointer-events: none; text-align: center;
  color: var(--muted); font-size: 14px; line-height: 1.6; }
#empty.show { display: flex; }
#empty b { display: block; color: var(--text); font-size: 16px; margin-bottom: 4px; }
.none { padding: 10px; font-size: 12.5px; color: var(--muted); }

/* legend */
#legend { position: fixed; left: 24px; bottom: 24px; z-index: 10; width: 244px; padding: 14px 8px 8px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(14px); }
#legend { max-height: calc(100vh - 170px); display: flex; flex-direction: column; }
#legend h2 { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 0 10px 8px;
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
#lg-back { display: none; background: none; border: 0; font: 500 11.5px var(--font); letter-spacing: 0; text-transform: none; color: var(--muted); cursor: pointer; padding: 2px 6px; border-radius: 6px; }
#lg-back:hover { color: var(--text); background: rgba(255,255,255,.08); }
#lg { overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent; }
#lg::-webkit-scrollbar { width: 8px; }
#lg::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 4px; }
.lg { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 10px; background: none; border: 0;
  border-radius: 8px; color: var(--muted); font: 500 13px var(--font); cursor: pointer; text-align: left; transition: background .12s, color .12s, opacity .12s; }
.lg:hover { background: rgba(255,255,255,.06); color: var(--text); }
.lg.on { color: var(--text); background: rgba(255,255,255,.08); }
.lg.off { opacity: .35; }
.lg i { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.lg span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lg b { font-weight: 500; font-variant-numeric: tabular-nums; color: var(--faint); font-size: 12px; }

/* stats + hint */
#stats { display: flex; flex-wrap: nowrap; justify-content: flex-start; gap: 22px; align-items: baseline; white-space: nowrap;
  width: 0; min-width: 100%; margin-top: -4px;   /* width 0 + min-width 100%: never makes the block wider than the controls row above */
  text-shadow: 0 0 3px var(--bg), 0 0 6px var(--bg), 0 0 10px var(--bg), 0 0 14px var(--bg); }   /* dark halo keeps it readable over nodes */
#stats .st { display: flex; align-items: baseline; gap: 5px; cursor: default; }
#stats b { font-size: 13.5px; font-weight: 650; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
#stats b em { font-style: normal; font-size: 11.5px; font-weight: 500; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
#stats small { font-size: 12px; color: var(--muted); }
#hint { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); font-size: 12px; color: var(--muted);
  z-index: 5; white-space: nowrap; pointer-events: none;
  text-shadow: 0 0 3px var(--bg), 0 0 6px var(--bg), 0 0 10px var(--bg), 0 0 14px var(--bg); }

/* svg bits */
.edge { stroke: #fff; stroke-opacity: .07; fill: none; }
.edge.hi { stroke-opacity: .55; }
.edge.dim { stroke-opacity: .015; }
.edge { transition: stroke-opacity .15s; }
.hit { stroke: transparent; stroke-width: 9px; fill: none; cursor: pointer; }
.node { stroke: var(--bg); stroke-width: 1.2; transition: opacity .15s; cursor: pointer; }
.node.dim { opacity: .1; }
.node.pin { stroke: #fff; stroke-width: 2.5; }
.node.sub { opacity: .45; }
.node.focus { opacity: 1; stroke: #fff; stroke-width: 3.5; filter: drop-shadow(0 0 7px rgba(255,255,255,.75)); }
.edge.focus { stroke-opacity: 1; stroke-width: 3.5px; }
.glabel { font: 600 calc(13px / var(--k, 1)) var(--font); fill: var(--muted); text-anchor: middle; pointer-events: none;
  paint-order: stroke; stroke: var(--bg); stroke-width: calc(4px / var(--k, 1)); stroke-linejoin: round; }

/* tooltip */
#tip { position: fixed; z-index: 20; pointer-events: none; display: none; min-width: 190px; max-width: 320px; padding: 12px 14px;
  background: rgba(34,34,32,.96); border: 1px solid rgba(255,255,255,.12); border-radius: 12px;
  box-shadow: 0 12px 32px rgba(0,0,0,.45); }
#tip .n { font-size: 14px; font-weight: 650; letter-spacing: -.01em; }
#tip .c { display: flex; align-items: center; gap: 7px; margin-top: 4px; font-size: 12px; color: var(--muted); }
#tip .c i { width: 8px; height: 8px; border-radius: 50%; }
#tip .d { font-size: 12px; color: var(--faint); margin-top: 2px; }
#tip .cf { font-size: 12px; color: #e8d9a8; margin-top: 6px; }
#tip .r { display: flex; justify-content: space-between; gap: 18px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line);
  font-size: 12px; color: var(--muted); }
#tip .r b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
#tip .pair { display: flex; flex-direction: column; gap: 5px; }
#tip .pair div { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 650; letter-spacing: -.01em; }
#tip .pair i { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
#tip .papers { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
#tip .papers h4 { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-bottom: 5px; }
#tip .papers p { font-size: 12px; line-height: 1.4; color: var(--muted); padding: 3px 0; }

@media (max-width: 760px) {
  #hint { display: none; }
  #stats { width: auto; min-width: 0; flex-wrap: wrap; gap: 2px 0; }
  #legend { width: calc(100% - 32px); left: 16px; bottom: 16px; }
  header { padding: 14px 16px 4px; }
  .brand span { display: none; }
}
</style>
</head>
<body>
<div id="stage"><svg id="svg" role="img" aria-label="Faculty collaboration network"></svg></div>

<header>
  <div class="hl">
    <div class="toprow">

<script>
const D = __DATA__;
// One colour per college (fixed by entity, validated for the dark surface).
const COL = ["#3987e5","#d95926","#199e70","#c98500","#d55181","#9085e9","#008300","#e66767","#1b98b0","#8f9a1c"];
const PERIODS = {"2006":"2006 – 2010","2011":"2011 – 2015","2016":"2016 – 2020","2021":"2021 – 2025"};
const state = { block: "2021", college: null, ego: null, psi: false, cfep: false, dept: null };
{ const q = new URLSearchParams(location.search);   // optional deep-link: ?college=0&ego=<id>&block=2016
  if (q.has("college")) state.college = +q.get("college"); if (q.has("ego")) state.ego = q.get("ego"); if (q.has("block")) state.block = q.get("block"); if (q.has("psi")) state.psi = true; if (q.has("cfep")) state.cfep = true; if (q.has("dept")) state.dept = q.get("dept"); }

const svg = d3.select("#svg");
const root = svg.append("g");
const gE = root.append("g"), gH = root.append("g"), gN = root.append("g"), gL = root.append("g");

const tip = document.getElementById("tip");
let sim = null, nodes = [], edges = [], byId = new Map(), adj = new Map(), groupKey = null, labelSel = null, groups = [];
const prevPos = new Map();
// How strongly departments hold together inside a college view. 0 = departments are linked as loosely as ordinary
// co-authors (old behaviour); 1 = as separated as colleges are in the all-colleges view. Currently 3/4 of the way.
const GROUP_BLEND = .75, lerp = (a, b, t) => a + (b - a) * t;
let focusId = null;   // collaborator currently hovered in the Insights panel while a person is selected
let ticks = 0, userZoomed = false, panelOpen = false, curDeptClr = {};

// ---------- controls ----------
const sel = document.getElementById("period");
Object.entries(PERIODS).forEach(([k, v]) => sel.add(new Option(v, k)));
sel.value = state.block;
sel.onchange = () => { state.block = sel.value; state.ego = null; closeResults(); render(); };

function crumbs() {
  const nav = document.getElementById("crumbs"); nav.innerHTML = "";
  const items = [{ t: "All colleges", go: () => { state.college = null; state.ego = null; render(); } }];
  if (state.college !== null) items.push({ t: D.colleges[state.college], go: () => { state.ego = null; render(); } });
  if (state.ego) items.push({ t: byId.get(state.ego)?.nm || "", go: null });
  items.forEach((it, i) => {
    if (i) { const s = document.createElement("span"); s.className = "sep"; s.textContent = "›"; nav.appendChild(s); }
    if (i === items.length - 1) { const h = document.createElement("span"); h.className = "here"; h.textContent = it.t; nav.appendChild(h); }
    else { const b = document.createElement("button"); b.textContent = it.t; b.onclick = it.go; nav.appendChild(b); }
  });
}
// ---------- headline numbers (follow the current period, college and filters) ----------
function statsRender() {
  const g = fullGraph(), c = state.college;
  let cross = 0, total = 0;
  g.edges.forEach(e => {
    const a = g.nodes.get(e[0]).c, b = g.nodes.get(e[1]).c;
    if (c === null) { total++; if (a !== b) cross++; }
    else if (a === c || b === c) { total++; if ((a === c) !== (b === c)) cross++; }   // ties between this college and the others
  });
  const pubs = nodes.reduce((sum, n) => sum + n.p, 0), set = (id, v) => document.getElementById(id).innerHTML = v;
  set("s-n", nodes.length.toLocaleString());
  set("s-e", edges.length.toLocaleString());
  set("s-x", cross.toLocaleString() + (total ? `<em>${Math.round(cross / total * 100)}%</em>` : ""));
  set("s-xl", "cross-college");
  set("s-p", pubs.toLocaleString());
  set("s-pl", state.psi ? "PSI papers" : "publications");
  document.getElementById("s-pw").title = "Each faculty member's publications in this period added together. A paper with several NC State authors counts once per author.";
  document.getElementById("s-x").parentNode.title = c === null ? "Collaborations between faculty in different colleges, and their share of all collaborations."
    : "Collaborations between faculty in this college and faculty in other colleges, as a share of all collaborations involving this college (the collaborations count to the left only includes ties inside the college).";
}

// ---------- insights panel ----------
// Whole-block graph (ignores the college drilldown) so the panel can describe cross-college ties
const gCache = {};
function fullGraph() {
  const key = state.block + "|" + state.psi + "|" + state.cfep;
  if (gCache[key]) return gCache[key];
  const data = D.blocks[state.block], psi = state.psi ? (D.psi[state.block] || { n: {}, e: [] }) : null;
  const nodes = new Map();
  data.n.forEach(r => { if ((psi && psi.n[r[0]] === undefined) || (state.cfep && r[5] !== 1)) return;
    nodes.set(r[0], { id: r[0], nm: r[1], c: r[2], d: (r[3] || "Other").trim() || "Other", p: psi ? psi.n[r[0]] : r[4], f: r[5] === 1, k: r[6] }); });
  const edges = (psi ? psi.e : data.e).filter(e => nodes.has(e[0]) && nodes.has(e[1]));
  const nb = new Map(), add = (a, b, w) => { if (!nb.has(a)) nb.set(a, new Map()); nb.get(a).set(b, w); };
  edges.forEach(e => { add(e[0], e[1], e[2]); add(e[1], e[0], e[2]); });
  return gCache[key] = { nodes, edges, nb };
}
const pEsc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = n => n.toLocaleString();
const hexA = (h, a) => h;   // (colour passed through; opacity handled in CSS)
function rows(list, valueOf, max, unit) {
  return list.map((n, i) => `<div class="li p" data-go="${pEsc(n.id)}" data-hl="p:${pEsc(n.id)}" style="--c:${state.college !== null && curDeptClr[n.d] ? curDeptClr[n.d] : COL[n.c]}">
    <span class="rk">${i + 1}</span>
    <div class="tx"><b>${pEsc(n.nm)}</b><small>${pEsc(n.d)}</small></div><span class="v">${fmt(valueOf(n))}${unit || ""}</span></div>`).join("");
}
function panelRender() {
  const g = fullGraph(), pt = document.getElementById("pt"), ps = document.getElementById("ps"), body = document.getElementById("pb");
  const metric = state.psi ? "PSI papers" : "Publications";
  let h = "";
  if (!g.nodes.size) { pt.textContent = "Insights"; ps.textContent = PERIODS[state.block]; body.innerHTML = '<div class="pnote">Nothing to show for the current filters.</div>'; return; }
  if (state.ego && g.nodes.has(state.ego)) {                        // ---- person
    const n = g.nodes.get(state.ego), nbs = [...(g.nb.get(n.id) || [])].map(([id, w]) => ({ n: g.nodes.get(id), w })).sort((a, b) => b.w - a.w);
    pt.textContent = n.nm; ps.innerHTML = `<i style="background:${COL[n.c]}"></i>${pEsc(D.colleges[n.c])} · ${pEsc(n.d)}`;
    const reach = new Set(nbs.map(x => x.n.c)), same = nbs.filter(x => x.n.c === n.c).length;
    if (n.f) h += `<div class="pnote" style="padding-top:12px">◆ CFEP cluster: <b style="color:var(--text)">${pEsc(D.cfep[n.k] || "")}</b></div>`;
    h += `<div class="grid3"><div><b>${fmt(n.p)}</b><small>${state.psi ? metric : metric.toLowerCase()}</small></div><div><b>${nbs.length}</b><small>collaborators</small></div><div><b>${reach.size || 0}</b><small>${reach.size === 1 ? "college" : "colleges"} reached</small></div></div>`;
    if (nbs.length) {
      h += `<div class="pnote">${same} in ${pEsc(D.colleges[n.c])}, ${nbs.length - same} in other colleges.</div>`;
      const max = nbs[0].w;
      h += `<h3>Collaborators <small>shared papers</small></h3>` + nbs.map(x => `<div class="li p" data-go="${pEsc(x.n.id)}" data-hl="p:${pEsc(x.n.id)}" style="--c:${COL[x.n.c]}">
        <div class="tx"><b>${pEsc(x.n.nm)}</b><small>${pEsc(x.n.d)}${x.n.c !== n.c ? " · " + pEsc(D.colleges[x.n.c]) : ""}</small></div><span class="v">${x.w}</span></div>`).join("");
    } else h += `<div class="pnote">${state.psi || state.cfep ? "No collaborations with anyone else inside the current filters." : "No collaborations in " + PERIODS[state.block] + "."}</div>`;
  } else if (state.college !== null) {                               // ---- college
    const c = state.college, people = [...g.nodes.values()].filter(n => n.c === c).sort((a, b) => b.p - a.p);
    const dep = new Map();
    people.forEach(n => { if (!dep.has(n.d)) dep.set(n.d, { d: n.d, n: 0, within: 0, cross: 0 }); dep.get(n.d).n++; });
    g.edges.forEach(e => { const a = g.nodes.get(e[0]), b = g.nodes.get(e[1]), w = e[2];
      if (a.c === c && b.c === c) { dep.get(a.d).within += w; if (b.d !== a.d) dep.get(b.d).within += w; }
      else if (a.c === c) dep.get(a.d).cross += w; else if (b.c === c) dep.get(b.d).cross += w; });
    const list = [...dep.values()].sort((a, b) => (b.within + b.cross) - (a.within + a.cross)), mx = Math.max(1, ...list.map(x => x.within + x.cross));
    const depts = [...new Set(people.map(n => n.d))].length;
    pt.textContent = D.colleges[c]; ps.innerHTML = `<i style="background:${COL[c]}"></i>${fmt(people.length)} faculty · ${depts} departments`;
    h += `<h3>Most active <small>${state.psi ? metric : metric.toLowerCase()}</small></h3>` + rows(people.slice(0, 10), n => n.p, people[0] ? people[0].p : 1);
    h += `<h3>Departments <small>shared papers</small></h3><div class="key"><span style="--k:${COL[c]}">within ${pEsc(D.colleges[c])}</span><span style="--k:rgba(255,255,255,.35)">with other colleges</span></div>`;
    h += list.map(x => { const t = x.within + x.cross, col = curDeptClr[x.d] || COL[c];
      return `<div class="dept" data-hl="d:${pEsc(x.d)}"><div class="top"><i style="background:${col}"></i><b title="${pEsc(x.d)}">${pEsc(x.d)}</b><span>${x.n} faculty</span></div>
      <div class="stk" style="width:calc(${(t / mx * 100).toFixed(1)}% - 18px)"><i style="width:${t ? x.within / t * 100 : 0}%;background:${col}"></i><i style="flex:1;background:rgba(255,255,255,.35)"></i></div>
      <small>${fmt(x.within)} within · ${fmt(x.cross)} cross-college</small></div>`; }).join("");
  } else {                                                           // ---- everything
    const top = [...g.nodes.values()].sort((a, b) => b.p - a.p).slice(0, 10);
    pt.textContent = "Overview"; ps.textContent = `${PERIODS[state.block]} · ${fmt(g.nodes.size)} faculty`;
    h += `<h3>Most active <small>${state.psi ? metric : metric.toLowerCase()}</small></h3>` + rows(top, n => n.p, top[0].p);
    const pair = new Map();
    g.edges.forEach(e => { const a = g.nodes.get(e[0]).c, b = g.nodes.get(e[1]).c; if (a === b) return;
      const k = Math.min(a, b) + "|" + Math.max(a, b); pair.set(k, (pair.get(k) || 0) + e[2]); });
    const pl = [...pair].sort((a, b) => b[1] - a[1]).slice(0, 6);
    if (pl.length) { const mx = pl[0][1];
      h += `<h3>Colleges that collaborate most <small>shared papers</small></h3>` + pl.map(([k, v]) => { const [a, b] = k.split("|").map(Number);
        return `<div class="li pr"><span class="pair"><i style="background:${COL[a]}"></i><i style="background:${COL[b]}"></i></span>
        <div class="tx"><b>${pEsc(D.colleges[a])} · ${pEsc(D.colleges[b])}</b></div><span class="v">${fmt(v)}</span></div>`; }).join(""); }
  }
  body.innerHTML = h; body.scrollTop = 0;
}
document.getElementById("pb").addEventListener("click", e => {
  const r = e.target.closest("[data-go]"); if (!r) return;
  const n = fullGraph().nodes.get(r.dataset.go); if (!n) return;
  if (state.college !== null && state.college !== n.c) state.college = null;   // keep the college only if they belong to it
  focusId = null; state.ego = n.id; render();
});
document.getElementById("pb").addEventListener("mouseover", e => {
  const r = e.target.closest("[data-hl]"); if (!r) return;
  const [k, v] = [r.dataset.hl.slice(0, 1), r.dataset.hl.slice(2)];
  clearTimeout(previewTimer);
  if (k === "p" && state.ego && v !== state.ego && adj.get(state.ego)?.has(v)) { focusId = v; applyEgo(); }   // in a person's view: highlight the collaborator, keep their network
  else if (k === "p") previewTimer = setTimeout(() => previewEgo(v), 70);   // short delay so sweeping down the list doesn't flicker
  else spot(n => n.d === v);
});
document.getElementById("pb").addEventListener("mouseleave", () => { clearTimeout(previewTimer); focusId = null; applyEgo(); });
// Hovering a person in the panel briefly lights up their whole network on the canvas (nothing is pinned).
let previewTimer = null;
function previewEgo(id) {
  if (!byId.has(id)) return;                          // not on the canvas right now (other college / filtered out)
  const nb = new Set([id, ...(adj.get(id) || [])]);
  gN.selectAll(".node").classed("dim", d => !nb.has(d.id)).classed("pin", d => d.id === id);
  gE.selectAll(".edge").classed("hi", e => e.source.id === id || e.target.id === id)
    .classed("dim", e => !(e.source.id === id || e.target.id === id));
}

const qIn = document.getElementById("q"), resBox = document.getElementById("results");

const searchCache = {};
let hits = [], hi = 0;
function searchIndex() {
  return searchCache[state.block] || (searchCache[state.block] = D.blocks[state.block].n.map(r => ({ r, k: norm(r[1]) })));
}
function runSearch() {
  const t = norm(qIn.value.trim());

  const words = t.split(/\s+/);
  const psiSet = state.psi ? (D.psi[state.block] || { n: {} }).n : null;
  hits = searchIndex().filter(x => (!psiSet || psiSet[x.r[0]] !== undefined) && (!state.cfep || x.r[5] === 1) && words.every(w => x.k.includes(w)))
    .map(x => ({ r: x.r, s: (x.k.startsWith(t) ? 0 : x.k.split(/\s+/).some(w => w.startsWith(words[0])) ? 1 : 2) }))
    .sort((a, b) => a.s - b.s || b.r[4] - a.r[4]).slice(0, 8).map(x => x.r);

}

    const name = esc(r[1]), m = norm(r[1]).indexOf(t.split(/\s+/)[0]);
    const label = m >= 0 ? name.slice(0, m) + "<mark>" + name.slice(m, m + t.split(/\s+/)[0].length) + "</mark>" + name.slice(m + t.split(/\s+/)[0].length) : name;
    el.innerHTML = `<i style="background:${COL[r[2]]}"></i><div><b>${label}</b><small>${esc(r[3] || D.colleges[r[2]])}</small></div><em>${r[4]} pubs</em>`;
    el.onmousedown = e => { e.preventDefault(); pick(r); };

}

qIn.addEventListener("input", runSearch);

// ---------- helpers ----------
function deptShades(deptNames, hex) {
  // Distinct colours that stay in the college's colour family. Candidates are never more vivid than the college
  // colour, stay in a mid lightness band, and spread over a hue range that starts at +-20deg and only widens
  // (up to +-44deg) if the department count needs it. They are picked greedily so each new department is as far
  // (CIELAB distance) from the ones already chosen as possible; the first (largest) department keeps the college colour.
  const base = d3.hsl(hex), baseLab = d3.lab(base), n = deptNames.length, out = {};
  const dist = (a, b) => Math.hypot(a.l - b.l, a.a - b.a, a.b - b.b), TARGET = 11;
  let chosen = [];
  for (const hr of [20, 26, 32, 38, 44]) {
    const cands = [];
    for (let i = -6; i <= 6; i++) for (let j = -3; j <= 3; j++) for (let k = 0; k < 3; k++) {
      const l = Math.min(.74, Math.max(.34, base.l + (j < 0 ? .13 : .18) * j / 3));
      const c = d3.hsl(base.h + i * hr / 6, Math.max(.25, base.s - .30 * k / 2), l);
      cands.push({ hex: c.formatHex(), lab: d3.lab(c) });
    }
    chosen = [cands.reduce((a, b) => dist(a.lab, baseLab) <= dist(b.lab, baseLab) ? a : b)];
    while (chosen.length < n) {
      let best = null, bd = -1;
      for (const c of cands) { const m = Math.min(...chosen.map(x => dist(c.lab, x.lab))); if (m > bd) { bd = m; best = c; } }
      chosen.push(best);
    }
    let m = Infinity;
    for (let x = 0; x < chosen.length; x++) for (let y = x + 1; y < chosen.length; y++) m = Math.min(m, dist(chosen[x].lab, chosen[y].lab));
    if (n < 2 || m >= TARGET) break;
  }
  deptNames.forEach((d, i) => out[d] = chosen[i % chosen.length].hex);   // deptNames is ordered largest first
  return out;
}

function applyEgo() {

// ---------- render ----------
function render() {

  const W = innerWidth, H = innerHeight, data = D.blocks[state.block];
  const psi = state.psi ? (D.psi[state.block] || { n: {}, e: [] }) : null;   // PSI filter: people + PSI co-authorships only
  const inPsi = r => !psi || psi.n[r[0]] !== undefined;
  const inCfep = r => !state.cfep || r[5] === 1;                // CFEP filter: members of a CFEP cluster only
  const inScope = r => (state.college === null || r[2] === state.college) && inPsi(r) && inCfep(r);
  nodes = data.n.filter(inScope).map(r => {
    const p = prevPos.get(r[0]);
    return { _new: !p, id: r[0], nm: r[1], c: r[2], d: (r[3] || "Other").trim() || "Other", p: psi ? psi.n[r[0]] : r[4], f: r[5] === 1, k: r[6], x: p ? p[0] : W / 2 + (Math.random() - .5) * 60, y: p ? p[1] : H / 2 + (Math.random() - .5) * 60 };
  });

  edges = (psi ? psi.e : data.e).filter(e => byId.has(e[0]) && byId.has(e[1])).map(e => ({ source: e[0], target: e[1], w: e[2], papers: e[3] || [], xc: byId.get(e[0]).c !== byId.get(e[1]).c }));
  adj = new Map(); edges.forEach(e => { [[e.source, e.target], [e.target, e.source]].forEach(([a, b]) => { if (!adj.has(a)) adj.set(a, new Set()); adj.get(a).add(b); }); });
  if (state.ego && !byId.has(state.ego)) state.ego = null;
  if (state.college === null || state.ego || !nodes.some(n => n.d === state.dept)) state.dept = null;   // department focus only applies inside a college

  const counts = {}; data.n.filter(r => inPsi(r) && inCfep(r)).forEach(r => counts[r[2]] = (counts[r[2]] || 0) + 1);
  if (!nodes.length) {            // nothing matches the current filters
    [gE, gH, gN, gL].forEach(g => g.selectAll("*").remove());
    statsRender();
    const on = [state.psi && "PSI", state.cfep && "CFEP"].filter(Boolean);
    document.getElementById("empty-t").textContent = on.length ? "No " + on.join(" + ") + " faculty in " + PERIODS[state.block] : "Nothing to show";
    document.getElementById("empty-s").textContent = state.psi && psi && !Object.keys(psi.n).length ? "PSI data begins in 2014. Try a later period." : (on.length ? "Try another period or remove a filter." : "");
    document.getElementById("empty").classList.add("show");
    legend(counts); crumbs(); filtersUI(); panelRender(); return;
  }
  document.getElementById("empty").classList.remove("show");

  // colours
  let clr;

    const cnt = {}; nodes.forEach(n => cnt[n.d] = (cnt[n.d] || 0) + 1);
    const depts = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a] || a.localeCompare(b)), sh = deptShades(depts, COL[state.college]);   // biggest departments get the best-separated colours

  const R = Math.min(W, H) * (state.college === null ? .44 : .38), anchor = new Map();
  keys.forEach((k, i) => { const a = 2 * Math.PI * i / keys.length - Math.PI / 2; anchor.set(k, { x: W / 2 + R * Math.cos(a), y: H / 2 + R * Math.sin(a) }); });

  groups = keys.map(k => ({ k, label: state.college === null ? D.colleges[k] : k, members: nodes.filter(n => groupKey(n) === k) }));

  const rS = d3.scaleSqrt().domain([1, Math.max(2, d3.max(nodes, n => n.p))]).range([3.5, 20]);
  nodes.forEach(n => n.r = rS(Math.max(1, n.p)));
  const wS = d3.scaleLinear().domain([1, Math.max(2, d3.max(edges, e => e.w))]).range([.8, 4]);

  // edges
  const eSel = gE.selectAll("line").data(edges, d => d.source + "|" + d.target).join("line").attr("class", "edge").attr("stroke-width", d => wS(d.w));
  // wide invisible hit-targets so thin lines are easy to hover

    .on("mousemove", moveTip)

  const nSel = gN.selectAll(".node").data(nodes, d => d.id)
    .join(enter => enter.append(d => document.createElementNS(SVGNS, d.f ? "path" : "circle")))   // CFEP members are diamonds
    .attr("class", "node").attr("fill", clr)
    .each(function (d) { const el = d3.select(this); if (d.f) el.attr("d", diamond(d.r)); else el.attr("r", d.r); })
    .on("mouseover", (ev, d) => showTip(ev, d)).on("mousemove", moveTip).on("mouseout", hideTip)

      .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })

      .strength(d => d.xc ? .03 : groupKey(d.source) === groupKey(d.target) ? .28 : (state.college !== null ? lerp(.28, .03, GROUP_BLEND) : .28)))

      hSel.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);

  if (fresh || new URLSearchParams(location.search).has("settle")) {

// scale + centre the network inside the free area (clear of the header, legend and stats)
function fit(W, H, ms) {

  nodes.forEach(n => { x0 = Math.min(x0, n.x - n.r); x1 = Math.max(x1, n.x + n.r); y0 = Math.min(y0, n.y - n.r); y1 = Math.max(y1, n.y + n.r); });
  labelSel.each(function () { const b = this.getBBox(); x0 = Math.min(x0, b.x); x1 = Math.max(x1, b.x + b.width); y0 = Math.min(y0, b.y); y1 = Math.max(y1, b.y + b.height); });
  const padL = W > 760 ? 290 : 24, padR = panelOpen && W > 760 ? 380 : 24, padT = 24, padB = W > 760 ? 90 : 300;
  const aw = W - padL - padR, ah = H - padT - padB;
  const k = Math.min(aw / (x1 - x0), ah / (y1 - y0), 1.4);
  const tx = padL + (aw - k * (x1 - x0)) / 2 - k * x0, ty = padT + (ah - k * (y1 - y0)) / 2 - k * y0;
  const t = d3.zoomIdentity.translate(tx, ty).scale(k);
  (ms ? svg.transition().duration(ms) : svg).call(zoom.transform, t);
}
// labels sit just outside each cluster, away from the centre, so nodes never cover them
function placeLabels(W, H) {
  labelSel.each(function (g) {
    const m = g.members; if (!m.length) return;
    const cx = d3.mean(m, n => n.x || 0), cy = d3.mean(m, n => n.y || 0);
    const ext = d3.max(m, n => Math.hypot((n.x || 0) - cx, (n.y || 0) - cy) + n.r);
    let dx = cx - W / 2, dy = cy - H / 2; const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
    d3.select(this).attr("x", cx + dx * (ext + 16)).attr("y", cy + dy * (ext + 16) + 4);
  });
}
addEventListener("resize", () => render());
requestAnimationFrame(() => setTimeout(render, 0));   // let the header / legend paint before the layout is computed
</script>
